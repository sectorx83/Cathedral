name: Cathedral CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Bubblewrap on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format sources
        run: cargo fmt --all
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace --all-features
      - name: Upload the tested formatting and lockfile
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-verified-source
          path: |
            crates/
            Cargo.lock

  studio-ui:
    name: Studio UI build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        working-directory: studio
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Build Studio
        working-directory: studio
        run: npm run build
      - name: Upload verified Studio lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-studio-lockfile
          path: studio/package-lock.json

  commit-verified-maintenance:
    name: Commit verified formatting and lockfile
    needs: [rust, studio-ui]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download the exact tested source files
        uses: actions/download-artifact@v4
        with:
          name: cathedral-verified-source
          path: verified
      - name: Download the verified Studio lockfile
        uses: actions/download-artifact@v4
        with:
          name: cathedral-studio-lockfile
          path: studio-verified
      - name: Apply tested formatting and lockfiles
        run: |
          cp -R verified/crates/. crates/
          cp verified/Cargo.lock Cargo.lock
          cp studio-verified/package-lock.json studio/package-lock.json
      - name: Record the verified source commit
        run: |
          mkdir -p docs
          cat > docs/CI_STATUS.md <<EOF
          # Continuous Integration Verification

          - Source commit: $GITHUB_SHA
          - Workflow run: [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - Platforms: Linux, Windows, macOS
          - Checks: rustfmt, Clippy with warnings denied, all workspace tests, and Studio UI production build
          - Verified at: $(date -u +'%Y-%m-%d %H:%M UTC')
          EOF
      - name: Commit only after the full platform matrix passes
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced during CI; leaving maintenance changes for the next run."
            exit 0
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates Cargo.lock studio/package-lock.json docs/CI_STATUS.md
            git commit -m "chore: format sources and lock dependencies"
            git push origin HEAD:main
          fi
