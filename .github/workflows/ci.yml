name: Cathedral CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Commit generated formatting and lockfile on main
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        run: |
          if ! git diff --quiet || [ ! -f Cargo.lock ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates Cargo.lock
            git commit -m "chore: format sources and lock dependencies"
            git push origin HEAD:main
          fi
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
