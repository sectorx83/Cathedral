name: Cathedral Studio Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package Studio (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            bundles: deb
          - platform: windows
            os: windows-latest
            bundles: msi
          - platform: macos
            os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked Studio dependencies
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Build platform installer
        working-directory: studio
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Install and remove Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package_file=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package_file"
          package_name=$(dpkg-deb --field "$package_file" Package)
          sudo apt-get install -y "$package_file"
          dpkg-query -W -f='${Status}' "$package_name" | grep -q 'install ok installed'
          sudo apt-get remove -y "$package_name"
          package_status=$(dpkg-query -W -f='${db:Status-Status}' "$package_name" 2>/dev/null || true)
          if [ "$package_status" = "installed" ]; then
            echo "Package remained installed after removal: $package_name" >&2
            exit 1
          fi
      - name: Install and remove Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'No MSI installer was produced.' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed: $($install.ExitCode)" }
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
      - name: Install and remove macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount="$RUNNER_TEMP/cathedral-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          app=$(find "$mount" -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app"
          target="/Applications/$(basename "$app")"
          ditto "$app" "$target"
          test -d "$target/Contents"
          rm -rf "$target"
          hdiutil detach "$mount"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-studio-${{ matrix.platform }}
          path: studio/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release assets
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: cathedral-studio-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
